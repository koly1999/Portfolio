<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · Signal Not Found · Luke Morrison</title>
  <meta name="description" content="Page not found. Luke Morrison's engineering portfolio.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#010502">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='8' y='8' width='16' height='16' rx='2' fill='none' stroke='%2300ff66' stroke-width='2'/%3E%3Crect x='13' y='13' width='6' height='6' fill='%23b6ff45'/%3E%3Cpath d='M12 8V3M16 8V3M20 8V3M12 29v-5M16 29v-5M20 29v-5M8 12H3M8 16H3M8 20H3M29 12h-5M29 16h-5M29 20h-5' stroke='%2300ff66' stroke-width='1.5'/%3E%3C/svg%3E">
  <!-- Self-contained: a 404 can be served at any path depth, so no relative assets. -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100svh;
      display: grid; place-items: center;
      background: #010502;
      background-image:
        linear-gradient(rgba(40, 240, 120, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(40, 240, 120, 0.05) 1px, transparent 1px);
      background-size: 56px 56px;
      color: #a3c2ab;
      font-family: "Segoe UI", system-ui, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .panel {
      max-width: 560px;
      padding: 48px 40px;
      background: rgba(120, 255, 170, 0.045);
      border: 1px solid rgba(80, 255, 150, 0.14);
      border-radius: 18px;
    }
    .code {
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 5rem; font-weight: 700; line-height: 1;
      color: #00ff66;
      text-shadow: 0 0 30px rgba(0, 255, 102, 0.4);
      margin-bottom: 12px;
    }
    .mono {
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 0.75rem; letter-spacing: 0.16em;
      color: #b6ff45; margin-bottom: 22px;
    }
    h1 { color: #eafff0; font-size: 1.5rem; margin-bottom: 12px; }
    p { font-size: 0.95rem; line-height: 1.6; margin-bottom: 28px; }
    a.home {
      display: inline-block;
      padding: 13px 28px;
      background: linear-gradient(120deg, #00ff66, #00c853);
      color: #02180a; font-weight: 600; text-decoration: none;
      border-radius: 8px;
      transition: transform 0.2s, box-shadow 0.25s;
    }
    a.home:hover { transform: translateY(-2px); box-shadow: 0 8px 32px -6px rgba(0, 255, 102, 0.35); }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .blink { animation: none; } }
  </style>
</head>
<body>
  <main class="panel">
    <div class="code">404</div>
    <p class="mono">ERR: SIGNAL NOT FOUND · TRACE OPEN<span class="blink">▊</span></p>
    <h1>This node doesn't exist on the board.</h1>
    <p>The page you probed was moved, renamed, or never routed. Head back to the main bus.</p>
    <a class="home" id="home-link" href="/Portfolio/">← Back to the portfolio</a>
  </main>
  <script>
    // Project sites live under /<repo>/; custom domains serve from root.
    var a = document.getElementById("home-link");
    a.href = location.hostname.endsWith("github.io")
      ? "/" + (location.pathname.split("/")[1] || "") + "/"
      : "/";
  </script>
</body>
</html>
